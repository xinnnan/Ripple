name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_credentialed_matrix:
        description: Run the protected staging role/tenant matrix
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Run production HTTP end-to-end smoke
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit

  credentialed-authorization:
    name: Credentialed staging authorization
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_credentialed_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CI: "true"
      RIPPLE_E2E_REQUIRE_CREDENTIALS: "1"
      RIPPLE_E2E_FIXTURES_FILE: ${{ github.workspace }}/scripts/credentialed-role-matrix.local.json
      RIPPLE_E2E_FIXTURES_JSON: ${{ secrets.RIPPLE_E2E_FIXTURES_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Require protected fixture secret
        shell: bash
        run: |
          if [ -z "$RIPPLE_E2E_FIXTURES_JSON" ]; then
            echo "::error::The staging environment secret RIPPLE_E2E_FIXTURES_JSON is required."
            exit 1
          fi

      - name: Materialize protected fixture
        shell: bash
        run: |
          umask 077
          printf '%s' "$RIPPLE_E2E_FIXTURES_JSON" > "$RIPPLE_E2E_FIXTURES_FILE"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run credentialed role and tenant matrix
        run: npm run test:e2e:credentialed

      - name: Remove protected fixture
        if: always()
        shell: bash
        run: rm -f "$RIPPLE_E2E_FIXTURES_FILE"
